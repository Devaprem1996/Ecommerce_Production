name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-yathuarokiyagam-backend-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --app yathuarokiyagam-backend-prod --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://yathuarokiyagam-backend-prod.fly.dev/api/v1/health >/dev/null; then
              echo "Backend healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Backend health check timed out." >&2
          exit 1