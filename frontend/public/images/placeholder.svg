    <rect x="90" y="100" width="220" height="200" rx="8" stroke="#9CA3AF" stroke-width="4"/>
  </g>
  
  <!-- Indicator Text -->
  <text x="200" y="340" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">
