  <rect width="400" height="400" rx="16" fill="#F4F6F5"/>
  
  <!-- Dashed card border -->
  <rect x="20" y="20" width="360" height="360" rx="12" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Vector Image/Photo Icon -->
  <g opacity="0.6">
    <!-- Sun/Moon -->
    <circle cx="230" cy="150" r="18" fill="#9CA3AF"/>
    <!-- Mountain outlines -->
    <path d="M120 280L180 200C184 195 191 195 195 200L235 250L260 220C264 215 271 215 275 220L310 280H120Z" fill="#9CA3AF"/>
