version: '3.8'

# =================================================================
# PRODUCTION DOCKER COMPOSE CONFIGURATION (HARDENED FOR 2 vCPU, 8 GB VPS)
# =================================================================
# Features:
#   - Strict resource limits (Memory & CPU) to prevent VPS OOM panics
#   - Dedicated Healthcheck probes (/healthz and /ready) on all services
#   - Sentry error tracking & monitoring environment variables
#   - Docker json-file log rotation (max 20m, 3 files)
#   - Zero-downtime rolling reload compatibility with Nginx
# =================================================================

services:
  # =================================================================
  # 1. DATABASE: PostgreSQL 16 (NVMe Volume Persistence)
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: yathu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yathu_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-yathu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yathu_secure_pass_2026}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yathu_admin} -d ${POSTGRES_DB:-yathu_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.2'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app_network

  # =================================================================
  # 2. BACKEND: Express.js + Prisma API
  # =================================================================
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/devaprem1996/ecommerce-backend:latest}
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    container_name: yathu_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-yathu_admin}:${POSTGRES_PASSWORD:-yathu_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-yathu_ecommerce}?sslmode=disable&connection_limit=20&pool_timeout=10
      DIRECT_URL: postgresql://${POSTGRES_USER:-yathu_admin}:${POSTGRES_PASSWORD:-yathu_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-yathu_ecommerce}?sslmode=disable&connection_limit=20&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://yathuarokiyagam.com}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_PATH: /var/www/uploads
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      # Sentry Observability & Tracing
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
    volumes:
      - media_uploads:/var/www/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app_network

  # =================================================================
  # 3. FRONTEND: Next.js Web Application
  # =================================================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/devaprem1996/ecommerce-frontend:latest}
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: yathu_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:8080/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 2048M
        reservations:
          cpus: '0.2'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app_network

  # =================================================================
  # 4. REVERSE PROXY: Nginx (SSL Termination + Media Caching)
  # =================================================================
  nginx:
    image: nginx:alpine
    container_name: yathu_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_uploads:/var/www/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app_network

  # =================================================================
  # 5. MONITORING: Uptime Kuma (Uptime & Webhook Alerting)
  # =================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: yathu_uptime_kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app_network

volumes:
  postgres_data:
    name: yathu_postgres_data
  media_uploads:
    name: yathu_media_uploads
  certbot_www:
    name: yathu_certbot_www
  certbot_conf:
    name: yathu_certbot_conf
  uptime_kuma_data:
    name: yathu_uptime_kuma_data

networks:
  app_network:
    name: yathu_network
    driver: bridge
