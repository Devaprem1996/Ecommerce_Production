version: '3.8'

services:
  # =================================================================
  # 1. DATABASE: PostgreSQL 16 (Self-Hosted on NVMe Volume)
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: yathu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yathu_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-yathu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yathu_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yathu_admin} -d ${POSTGRES_DB:-yathu_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # =================================================================
  # 2. BACKEND: Express.js + Prisma API
  # =================================================================
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    container_name: yathu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-yathu_admin}:${POSTGRES_PASSWORD:-yathu_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-yathu_ecommerce}?sslmode=disable
      DIRECT_URL: postgresql://${POSTGRES_USER:-yathu_admin}:${POSTGRES_PASSWORD:-yathu_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-yathu_ecommerce}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-for-jwt-signing-tokens-123456}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-secret-key-for-refresh-tokens-signing-987654}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_PATH: /var/www/uploads
      CLOUDINARY_URL: ${CLOUDINARY_URL}
    volumes:
      - media_uploads:/var/www/uploads
    networks:
      - app_network

  # =================================================================
  # 3. FRONTEND: Next.js Web Application
  # =================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: yathu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - app_network

  # =================================================================
  # 4. REVERSE PROXY: Nginx (Direct Media Caching + SSL Termination)
  # =================================================================
  nginx:
    image: nginx:alpine
    container_name: yathu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_uploads:/var/www/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  # =================================================================
  # 5. MONITORING: Uptime Kuma (Uptime Status & Downtime Alerting)
  # =================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: yathu_uptime_kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - app_network

volumes:
  postgres_data:
    name: yathu_postgres_data
  media_uploads:
    name: yathu_media_uploads
  certbot_www:
    name: yathu_certbot_www
  certbot_conf:
    name: yathu_certbot_conf
  uptime_kuma_data:
    name: yathu_uptime_kuma_data

networks:
  app_network:
    name: yathu_network
    driver: bridge
